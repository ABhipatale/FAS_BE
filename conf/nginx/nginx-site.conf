# nginx vhost for the Laravel API (richarvey/nginx-php-fpm on Render).
#
# The image's start script copies conf/nginx/nginx-site.conf over its own
# default vhost. Without this file the default config serves paths as static
# files and never falls back to index.php, so ONLY "/" reached Laravel and
# every real route (/up, /api/*) returned nginx's own 404 - which is what made
# the browser report "OPTIONS /api/login 404" and look like a CORS failure.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html/public;
    index index.php index.html;

    server_name _;
    charset utf-8;

    # Face descriptors and base64 logos are posted as JSON, so keep the body
    # limit comfortably above nginx's 1M default.
    client_max_body_size 20M;

    # This is the line that was missing: hand anything that is not a real file
    # to Laravel's front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never serve dotfiles (.env, .git, ...)
    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
    }

    error_page 404 /index.php;

    access_log /dev/stdout;
    error_log /dev/stderr;
}
